name: erebrus_ai
description: "Erebrus AI — local LLM runner. Download models, chat on-device, and serve them to your network."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: ^4.2815.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/erebrus-ai-icon-1024.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0A0A0C"
  adaptive_icon_background: "#0A0A0C"
  adaptive_icon_foreground: "assets/icons/erebrus-ai-icon-1024.png"
  macos:
    generate: true
    image_path: "assets/icons/erebrus-ai-icon-1024.png"
  windows:
    generate: true
    image_path: "assets/icons/erebrus-ai-icon-1024.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/icons/erebrus-ai-icon-1024.png

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
