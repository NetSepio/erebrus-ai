name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Release macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: cp env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r erebrus-ai-macos.zip Erebrus\ AI.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/erebrus-ai-macos.zip

  build-windows:
    name: Release Windows
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: cp env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Dump TurboQuant ExternalProject logs
        if: failure()
        shell: pwsh
        run: |
          $root = "build/windows/x64/plugins/erebrus_turboquant"
          Write-Host "===== cmake --install (to surface the real error) ====="
          & cmake --install build/windows/x64 --config Release --prefix "build/windows/x64/runner/Release"
          Write-Host "===== sidecar / Release listing ====="
          Get-ChildItem -Recurse "$root/sidecar","$root/turboquant-ep/build/bin" -ErrorAction SilentlyContinue | Select-Object FullName,Length
          Get-ChildItem "build/windows/x64/runner/Release" -ErrorAction SilentlyContinue | Select-Object Name,Length
          if (Test-Path "$root/cmake_install.cmake") {
            Write-Host "===== plugin cmake_install.cmake ====="
            Get-Content "$root/cmake_install.cmake"
          }

      - name: Verify pinned TurboQuant runtime
        shell: pwsh
        run: |
          $runtime = "build/windows/x64/runner/Release/erebrus_turboquant/llama-server.exe"
          $manifest = "build/windows/x64/runner/Release/erebrus_turboquant/erebrus-turboquant-runtime.json"
          if (!(Test-Path $runtime) -or !(Test-Path $manifest)) { exit 1 }
          $metadata = Get-Content $manifest | ConvertFrom-Json
          if ($metadata.revision -ne "c26cbdffcf6fc9b7430cd6b117757e9a3f70b7ea") { exit 1 }
          if ($metadata.source_archive_sha256 -ne "5a7221222d658ca93dbf62ba2ca0623712547e9640605c12ebdfa8963aeda239") { exit 1 }
          if ($metadata.accelerator -ne "CPU") { exit 1 }
          if ($metadata.key_cache -ne "q8_0" -or $metadata.value_cache -ne "turbo3") { exit 1 }
          & $runtime --version | Select-String "c26cbdf"

      - name: Package Windows app
        run: |
          cd build/windows/x64/runner/Release
          7z a erebrus-ai-windows.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/erebrus-ai-windows.zip

  build-linux:
    name: Release Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev libsecret-1-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: cp env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Verify pinned TurboQuant runtime
        run: |
          runtime=build/linux/x64/release/bundle/lib/erebrus_turboquant/llama-server
          manifest=build/linux/x64/release/bundle/lib/erebrus_turboquant/erebrus-turboquant-runtime.json
          test -x "$runtime"
          grep -q '"revision": "c26cbdffcf6fc9b7430cd6b117757e9a3f70b7ea"' "$manifest"
          grep -q '"source_archive_sha256": "5a7221222d658ca93dbf62ba2ca0623712547e9640605c12ebdfa8963aeda239"' "$manifest"
          grep -q '"accelerator": "CPU"' "$manifest"
          grep -q '"key_cache": "q8_0"' "$manifest"
          grep -q '"value_cache": "turbo3"' "$manifest"
          "$runtime" --version | grep -q c26cbdf

      - name: Package Linux app
        run: |
          cd build/linux/x64/release/bundle
          zip -r erebrus-ai-linux.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle/erebrus-ai-linux.zip

  build-android:
    name: Release Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env placeholder
        run: cp env.example .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
