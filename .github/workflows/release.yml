name: Release

# Push a tag that matches pubspec.yaml (version: 1.2.0+3 -> tag v1.2.0) to
# build every platform and publish a GitHub Release with a manifest, checksums,
# and that version's CHANGELOG.md section. A manual run builds the same
# artifacts without publishing anything.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Build-time values for scripts/write-ci-env.sh. Each reads an Actions secret,
# falling back to a repo variable of the same name; public endpoints default to
# production. They are compiled into the app, so they are configuration rather
# than credentials; signing secrets stay scoped to the steps that use them.
env:
  REOWN_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID || vars.REOWN_PROJECT_ID }}
  GATEWAY_URL: ${{ vars.GATEWAY_URL || 'https://gateway.erebrus.io' }}
  EREBRUS_WEB_ORIGIN: ${{ vars.EREBRUS_WEB_ORIGIN || 'https://erebrus.io' }}
  MODEL_CATALOG_BASE_URL: ${{ vars.MODEL_CATALOG_BASE_URL || 'https://erebrus.io' }}
  GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || vars.GOOGLE_SERVER_CLIENT_ID }}
  APPLE_SERVICE_ID: ${{ secrets.APPLE_SERVICE_ID || vars.APPLE_SERVICE_ID }}
  APPLE_REDIRECT_URI: ${{ secrets.APPLE_REDIRECT_URI || vars.APPLE_REDIRECT_URI }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check the tag
        id: version
        run: |
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE##*+}"
          TAG="v${VERSION_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec.yaml version ${VERSION_LINE} (expected ${TAG})."
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      # Headings look like "## 1.2.0+3 — 2026-10-30"; "## 1.2.0" also matches.
      - name: Extract changelog section
        env:
          VERSION_LINE: ${{ steps.version.outputs.version_name }}+${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          names = "|".join(re.escape(v) for v in (os.environ["VERSION_LINE"], os.environ["VERSION_NAME"]))
          changelog = Path("CHANGELOG.md").read_text()
          section = re.search(rf"^## \[?(?:{names})\]?(?:[ \t][^\n]*)?\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if section is None or not section.group(1).strip():
              message = f"CHANGELOG.md has no section for {os.environ['VERSION_LINE']}"
              if os.environ["GITHUB_REF_TYPE"] == "tag":
                  raise SystemExit(f"::error::{message}")
              print(f"::warning::{message}")
              body = "_No changelog entry._"
          else:
              body = section.group(1).strip()
          Path("changelog-section.md").write_text(body + "\n")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: changelog-section.md

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free gitleaks CLI (pinned + checksum-verified); see ci.yml.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan git history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: cp env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test

  build-android:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    outputs:
      playstore_cert: ${{ steps.signing.outputs.playstore }}
      dappstore_cert: ${{ steps.signing.outputs.dappstore }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check signing secrets
        env:
          PLAYSTORE_KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          PLAYSTORE_STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
          PLAYSTORE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          PLAYSTORE_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          DAPPSTORE_KEYSTORE_BASE64: ${{ secrets.DAPPSTORE_KEYSTORE_BASE64 }}
          DAPPSTORE_STORE_PASSWORD: ${{ secrets.DAPPSTORE_STORE_PASSWORD }}
          DAPPSTORE_KEY_ALIAS: ${{ secrets.DAPPSTORE_KEY_ALIAS }}
          DAPPSTORE_KEY_PASSWORD: ${{ secrets.DAPPSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            PLAYSTORE_KEYSTORE_BASE64 PLAYSTORE_STORE_PASSWORD PLAYSTORE_KEY_ALIAS PLAYSTORE_KEY_PASSWORD \
            DAPPSTORE_KEYSTORE_BASE64 DAPPSTORE_STORE_PASSWORD DAPPSTORE_KEY_ALIAS DAPPSTORE_KEY_PASSWORD \
            REOWN_PROJECT_ID
          do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Missing Actions secrets: ${missing[*]}"
            exit 1
          fi

      # Play and the Solana dApp Store must use different keys, so each flavor
      # gets its own keystore and we refuse to build if they resolve to the
      # same certificate.
      - name: Configure release signing
        id: signing
        env:
          PLAYSTORE_KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          PLAYSTORE_STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
          PLAYSTORE_KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          PLAYSTORE_KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          DAPPSTORE_KEYSTORE_BASE64: ${{ secrets.DAPPSTORE_KEYSTORE_BASE64 }}
          DAPPSTORE_STORE_PASSWORD: ${{ secrets.DAPPSTORE_STORE_PASSWORD }}
          DAPPSTORE_KEY_ALIAS: ${{ secrets.DAPPSTORE_KEY_ALIAS }}
          DAPPSTORE_KEY_PASSWORD: ${{ secrets.DAPPSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p android/release-keys
          printf '%s' "${PLAYSTORE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > android/release-keys/erebrus-ai-playstore.jks
          printf '%s' "${DAPPSTORE_KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > android/release-keys/erebrus-ai-dappstore.jks
          test -s android/release-keys/erebrus-ai-playstore.jks
          test -s android/release-keys/erebrus-ai-dappstore.jks

          fingerprint() {
            keytool -exportcert -keystore "$1" -alias "$2" -storepass:env "$3" | sha256sum | awk '{ print $1 }'
          }
          playstore=$(fingerprint android/release-keys/erebrus-ai-playstore.jks "${PLAYSTORE_KEY_ALIAS}" PLAYSTORE_STORE_PASSWORD)
          dappstore=$(fingerprint android/release-keys/erebrus-ai-dappstore.jks "${DAPPSTORE_KEY_ALIAS}" DAPPSTORE_STORE_PASSWORD)
          echo "playstore keystore certificate SHA-256: ${playstore}"
          echo "dappstore keystore certificate SHA-256: ${dappstore}"
          if [[ "${playstore}" == "${dappstore}" ]]; then
            echo "::error::The playstore and dappstore secrets select the same certificate. Check the keystore and alias secrets."
            exit 1
          fi
          echo "playstore=${playstore}" >> "${GITHUB_OUTPUT}"
          echo "dappstore=${dappstore}" >> "${GITHUB_OUTPUT}"

          # key.properties is a Java properties file: backslashes need escaping.
          esc() { printf '%s' "${1//\\/\\\\}"; }
          {
            echo "playstore.storeFile=../release-keys/erebrus-ai-playstore.jks"
            echo "playstore.storePassword=$(esc "${PLAYSTORE_STORE_PASSWORD}")"
            echo "playstore.keyAlias=$(esc "${PLAYSTORE_KEY_ALIAS}")"
            echo "playstore.keyPassword=$(esc "${PLAYSTORE_KEY_PASSWORD}")"
            echo "dappstore.storeFile=../release-keys/erebrus-ai-dappstore.jks"
            echo "dappstore.storePassword=$(esc "${DAPPSTORE_STORE_PASSWORD}")"
            echo "dappstore.keyAlias=$(esc "${DAPPSTORE_KEY_ALIAS}")"
            echo "dappstore.keyPassword=$(esc "${DAPPSTORE_KEY_PASSWORD}")"
          } > android/key.properties

      - run: scripts/write-ci-env.sh
      - run: flutter pub get

      # llama.cpp ships for arm64 only (minSdk 28), matching
      # scripts/build-all-release.sh. The App Bundle is what the Play Console
      # takes; the dApp Store takes the APK.
      - name: Build release APKs and Play Store App Bundle
        run: |
          DEFINES=(--dart-define-from-file=.env --target-platform android-arm64)
          scripts/ci-annotate.sh flutter build apk --flavor playstore --release "${DEFINES[@]}"
          scripts/ci-annotate.sh flutter build appbundle --flavor playstore --release "${DEFINES[@]}"
          scripts/ci-annotate.sh flutter build apk --flavor dappstore --release "${DEFINES[@]}"

      - name: Package and verify signatures
        env:
          EXPECTED_PLAYSTORE_SHA256: ${{ steps.signing.outputs.playstore }}
          EXPECTED_DAPPSTORE_SHA256: ${{ steps.signing.outputs.dappstore }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-playstore-release.apk "dist/erebrus-ai-playstore-${TAG}.apk"
          cp build/app/outputs/flutter-apk/app-dappstore-release.apk "dist/erebrus-ai-dappstore-${TAG}.apk"
          cp build/app/outputs/bundle/playstoreRelease/app-playstore-release.aab "dist/erebrus-ai-playstore-${TAG}.aab"
          # R8 obfuscates release code. The App Bundle carries its mapping for
          # the Play Console; the zip deobfuscates stack traces from the APKs.
          (cd build/app/outputs/mapping && zip -q -r "${GITHUB_WORKSPACE}/dist/erebrus-ai-r8-mapping-${TAG}.zip" \
            playstoreRelease/mapping.txt dappstoreRelease/mapping.txt)

          bt=$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          apk_cert() {
            "${bt}/apksigner" verify --print-certs "$1" | awk '/certificate SHA-256 digest/ { print $NF; exit }'
          }
          playstore=$(apk_cert "dist/erebrus-ai-playstore-${TAG}.apk")
          dappstore=$(apk_cert "dist/erebrus-ai-dappstore-${TAG}.apk")
          echo "playstore APK certificate SHA-256: ${playstore}"
          echo "dappstore APK certificate SHA-256: ${dappstore}"
          # An App Bundle is jar-signed; keytool prints colon-separated upper case.
          bundle=$(keytool -printcert -jarfile "dist/erebrus-ai-playstore-${TAG}.aab" \
            | awk '/SHA256:/ { print $2; exit }' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "playstore AAB certificate SHA-256: ${bundle}"
          if [[ "${playstore}" != "${EXPECTED_PLAYSTORE_SHA256}" || "${dappstore}" != "${EXPECTED_DAPPSTORE_SHA256}" || "${bundle}" != "${EXPECTED_PLAYSTORE_SHA256}" ]]; then
            echo "::error::An APK or the App Bundle is not signed with its flavor's keystore. Check the Gradle signing configuration."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  build-macos:
    needs: [prepare, verify]
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      # The Runner target signs with NetSepio's Apple Developer team
      # (76KW3AMAW5) and Sign in with Apple, which CI has no certificate for.
      # Until it does, skip the build (job stays green) instead of failing.
      # Set the repo variable ENABLE_MACOS_BUILD=true once signing is set up.
      - name: Check macOS signing availability
        id: gate
        env:
          ENABLED: ${{ vars.ENABLE_MACOS_BUILD }}
        run: |
          if [[ "${ENABLED}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::macOS build skipped — needs Apple Developer signing for team 76KW3AMAW5. Set repo variable ENABLE_MACOS_BUILD=true once it is configured."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.enabled == 'true'
        with:
          channel: stable
          cache: true

      # erebrus_speech uses SpeechAnalyzer, which needs the iOS/macOS 26 SDK,
      # and mlx-swift declares swift-tools-version 6.3, which needs Xcode 26.4+
      # (older Xcode crashes resolving packages). Picks the newest stable Xcode.
      - name: Select Xcode 26.4 or newer
        if: steps.gate.outputs.enabled == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          version="${xcode##*/Xcode_}"; version="${version%.app}"
          if [[ -z "${xcode}" || "$(printf '%s\n' 26.4 "${version}" | sort -V | head -1)" != 26.4 ]]; then
            echo "::error::No Xcode 26.4+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          # Xcode 26+ ships the Metal compiler as a separate component; mlx-swift
          # (erebrus_mlx) compiles .metal shaders and fails without it.
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          # mlx-swift ships a build plugin (CudaBuild) that Xcode runs only
          # after someone trusts it in the IDE, which CI cannot do. The runner
          # is discarded after the job and Package.resolved pins every package
          # to a commit. (Apple's key is spelled "Validatation".)
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

      - if: steps.gate.outputs.enabled == 'true'
        run: scripts/write-ci-env.sh
      - if: steps.gate.outputs.enabled == 'true'
        run: flutter pub get
      - if: steps.gate.outputs.enabled == 'true'
        run: scripts/pin-spm-platforms.sh macos
      - if: steps.gate.outputs.enabled == 'true'
        run: scripts/ci-annotate.sh flutter build macos --release --dart-define-from-file=.env

      - name: Package macOS app
        if: steps.gate.outputs.enabled == 'true'
        run: |
          mkdir -p dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/Erebrus AI.app" "dist/erebrus-ai-macos-${TAG}.zip"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: macos-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  build-linux:
    needs: [prepare, verify]
    # Pinned: the bundle links against the build host's glibc (see ci.yml).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: scripts/write-ci-env.sh
      - run: flutter pub get
      - run: scripts/ci-annotate.sh flutter build linux --release --dart-define-from-file=.env

      - name: Verify pinned TurboQuant runtime
        run: |
          runtime=build/linux/x64/release/bundle/lib/erebrus_turboquant/llama-server
          manifest=build/linux/x64/release/bundle/lib/erebrus_turboquant/erebrus-turboquant-runtime.json
          test -x "$runtime"
          grep -q '"revision": "c26cbdffcf6fc9b7430cd6b117757e9a3f70b7ea"' "$manifest"
          grep -q '"source_archive_sha256": "5a7221222d658ca93dbf62ba2ca0623712547e9640605c12ebdfa8963aeda239"' "$manifest"
          grep -q '"accelerator": "CPU"' "$manifest"
          grep -q '"key_cache": "q8_0"' "$manifest"
          grep -q '"value_cache": "turbo3"' "$manifest"
          # The archive checksum (enforced by CMake) and the manifest pin the source;
          # --version reports the enclosing repo's commit, so only check it runs.
          "$runtime" --version > /dev/null 2>&1

      - name: Package Linux bundle
        run: |
          mkdir -p dist
          tar -czf "dist/erebrus-ai-linux-${TAG}.tar.gz" \
            -C build/linux/x64/release --transform 's,^bundle,erebrus-ai,' bundle

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  build-windows:
    needs: [prepare, verify]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The runner default is PowerShell, which hands `scripts/*.sh` to the
      # file association instead of running it.
      - shell: bash
        run: scripts/write-ci-env.sh
      - run: flutter pub get

      # See ci.yml: the TurboQuant install step can fail after the app built.
      - name: Build Windows
        continue-on-error: true
        run: flutter build windows --release --dart-define-from-file=.env

      - name: Install Windows bundle
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/erebrus_ai.exe"
          $sidecar = "build/windows/x64/runner/Release/erebrus_turboquant/llama-server.exe"
          if (!(Test-Path $exe) -or !(Test-Path $sidecar)) {
            Write-Host "Completing install with an explicit prefix"
            cmake --install build/windows/x64 --config Release --prefix "$PWD/build/windows/x64/runner/Release"
          }
          if (!(Test-Path $exe)) { throw "erebrus_ai.exe was not produced" }
          if (!(Test-Path $sidecar)) { throw "TurboQuant llama-server.exe was not produced" }

      - name: Verify pinned TurboQuant runtime
        shell: pwsh
        run: |
          $runtime = "build/windows/x64/runner/Release/erebrus_turboquant/llama-server.exe"
          $manifest = "build/windows/x64/runner/Release/erebrus_turboquant/erebrus-turboquant-runtime.json"
          if (!(Test-Path $runtime) -or !(Test-Path $manifest)) { exit 1 }
          $metadata = Get-Content $manifest | ConvertFrom-Json
          if ($metadata.revision -ne "c26cbdffcf6fc9b7430cd6b117757e9a3f70b7ea") { exit 1 }
          if ($metadata.source_archive_sha256 -ne "5a7221222d658ca93dbf62ba2ca0623712547e9640605c12ebdfa8963aeda239") { exit 1 }
          if ($metadata.accelerator -ne "CPU") { exit 1 }
          if ($metadata.key_cache -ne "q8_0" -or $metadata.value_cache -ne "turbo3") { exit 1 }
          # The archive checksum (enforced by CMake) and the manifest pin the source;
          # --version reports the enclosing repo's commit, so only check it runs.
          & $runtime --version 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dest = "dist/erebrus-ai-windows-$env:TAG.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $dest -Force
          if ((Get-Item $dest).Length -eq 0) { throw "Empty Windows archive" }
          Write-Host "Packaged $dest"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.TAG }}
          if-no-files-found: error
          path: dist/*

  github-release:
    if: github.ref_type == 'tag'
    needs: [prepare, build-android, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ env.TAG }}"
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Write manifest, checksums and notes
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
          PLAYSTORE_CERT: ${{ needs.build-android.outputs.playstore_cert }}
          DAPPSTORE_CERT: ${{ needs.build-android.outputs.dappstore_cert }}
        run: |
          python3 scripts/write-release-manifest.py \
            --dist dist --tag "${TAG}" --version "${VERSION_NAME}" --build "${VERSION_CODE}" \
            --commit "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}" \
            --playstore-cert "${PLAYSTORE_CERT}" --dappstore-cert "${DAPPSTORE_CERT}" \
            --changelog changelog-section.md --notes notes.md
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Erebrus AI ${{ needs.prepare.outputs.version_name }}
          body_path: notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
