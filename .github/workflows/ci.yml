name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free gitleaks CLI (pinned + checksum-verified) instead of
      # gitleaks-action, which needs a paid license on organization repos and
      # never gets secrets on fork PRs.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan git history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  verify:
    name: Analyze + Test
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # pubspec.yaml bundles .env as an asset.
      - run: cp env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-pub

      - name: Validate benchmark regression gate
        run: >-
          dart tool/check_benchmark_regression.dart
          tool/benchmark_baseline.fixture.json
          tool/benchmark_candidate.fixture.json

      - run: flutter test

  build-macos:
    name: Build macOS (${{ matrix.arch }}, unsigned)
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    # Runner signs with NetSepio's team (76KW3AMAW5) and Sign in with Apple,
    # which CI has no certificate for. flutter passes FLUTTER_XCODE_* to
    # xcodebuild as build settings, so this compiles the app without signing.
    env:
      FLUTTER_XCODE_CODE_SIGNING_ALLOWED: "NO"
      FLUTTER_XCODE_CODE_SIGNING_REQUIRED: "NO"
      FLUTTER_XCODE_CODE_SIGN_IDENTITY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # erebrus_speech uses SpeechAnalyzer, which needs the iOS/macOS 26 SDK,
      # and mlx-swift declares swift-tools-version 6.3, which needs Xcode 26.4+
      # (older Xcode crashes resolving packages). Picks the newest stable Xcode.
      - name: Select Xcode 26.4 or newer
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          version="${xcode##*/Xcode_}"; version="${version%.app}"
          if [[ -z "${xcode}" || "$(printf '%s\n' 26.4 "${version}" | sort -V | head -1)" != 26.4 ]]; then
            echo "::error::No Xcode 26.4+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          # Xcode 26+ ships the Metal compiler as a separate component; mlx-swift
          # (erebrus_mlx) compiles .metal shaders and fails without it.
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - run: cp env.example .env
      - run: flutter pub get
      - run: scripts/pin-spm-platforms.sh macos

      - name: Verify packaged llama.cpp Metal framework
        run: |
          binary=third_party/lib_llama_cpp_macos/macos/lib_llama_cpp_macos/Frameworks/lib_llama_cpp_macos.xcframework/macos-arm64_x86_64/lib_llama_cpp_macos.framework/Versions/A/lib_llama_cpp_macos
          shasum -a 256 -c third_party/lib_llama_cpp_macos/FRAMEWORK.sha256
          lipo "$binary" -verify_arch arm64 x86_64
          nm -gU "$binary" | grep -q _ggml_backend_metal_init

      - name: Test macOS backend resolver
        run: flutter test third_party/lib_llama_cpp_macos/test/lib_llama_cpp_macos_test.dart

      - run: scripts/ci-annotate.sh flutter build macos --release

      - name: Verify universal Whisper runtime
        run: |
          binary="build/macos/Build/Products/Release/Erebrus AI.app/Contents/Frameworks/whisper_ggml_plus.framework/Versions/A/whisper_ggml_plus"
          lipo "$binary" -verify_arch arm64 x86_64

  build-ios:
    name: Build iOS (unsigned)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # erebrus_speech uses SpeechAnalyzer, which needs the iOS/macOS 26 SDK,
      # and mlx-swift declares swift-tools-version 6.3, which needs Xcode 26.4+
      # (older Xcode crashes resolving packages). Picks the newest stable Xcode.
      - name: Select Xcode 26.4 or newer
        run: |
          xcode=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          version="${xcode##*/Xcode_}"; version="${version%.app}"
          if [[ -z "${xcode}" || "$(printf '%s\n' 26.4 "${version}" | sort -V | head -1)" != 26.4 ]]; then
            echo "::error::No Xcode 26.4+ on this runner:"; ls -d /Applications/Xcode*.app; exit 1
          fi
          sudo xcode-select -s "${xcode}/Contents/Developer"
          xcodebuild -version
          # Xcode 26+ ships the Metal compiler as a separate component; mlx-swift
          # (erebrus_mlx) compiles .metal shaders and fails without it.
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q 'Status: installed'; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - run: cp env.example .env
      - run: flutter pub get
      - run: scripts/pin-spm-platforms.sh ios

      - name: Verify packaged iOS llama.cpp Metal framework
        run: |
          device_binary=third_party/lib_llama_cpp_ios/ios/lib_llama_cpp_ios/Frameworks/lib_llama_cpp_ios.xcframework/ios-arm64/lib_llama_cpp_ios.framework/lib_llama_cpp_ios
          simulator_binary=third_party/lib_llama_cpp_ios/ios/lib_llama_cpp_ios/Frameworks/lib_llama_cpp_ios.xcframework/ios-arm64_x86_64-simulator/lib_llama_cpp_ios.framework/lib_llama_cpp_ios
          shasum -a 256 -c third_party/lib_llama_cpp_ios/FRAMEWORK.sha256
          lipo "$device_binary" -verify_arch arm64
          lipo "$simulator_binary" -verify_arch arm64 x86_64
          nm -gU "$device_binary" | grep -q _ggml_backend_metal_init

      - name: Test iOS backend resolver
        run: flutter test third_party/lib_llama_cpp_ios/test/lib_llama_cpp_ios_test.dart

      - run: scripts/ci-annotate.sh flutter build ios --release --no-codesign

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: cp env.example .env
      - run: flutter pub get

      # The TurboQuant sidecar's install step can fail inside `flutter build`
      # after the app itself compiled; the next step completes the install
      # and fails the job if either binary is missing.
      - name: Build Windows
        continue-on-error: true
        run: flutter build windows --release

      - name: Install Windows bundle
        shell: pwsh
        run: |
          $exe = "build/windows/x64/runner/Release/erebrus_ai.exe"
          $sidecar = "build/windows/x64/runner/Release/erebrus_turboquant/llama-server.exe"
          if (!(Test-Path $exe) -or !(Test-Path $sidecar)) {
            Write-Host "Completing install with an explicit prefix"
            cmake --install build/windows/x64 --config Release --prefix "$PWD/build/windows/x64/runner/Release"
          }
          if (!(Test-Path $exe)) { throw "erebrus_ai.exe was not produced" }
          if (!(Test-Path $sidecar)) { throw "TurboQuant llama-server.exe was not produced" }

      - name: Dump TurboQuant ExternalProject logs
        if: failure()
        shell: pwsh
        run: |
          $root = "build/windows/x64/plugins/erebrus_turboquant"
          if (Test-Path $root) {
            Get-ChildItem -Recurse $root -Include *.log,*.txt,*.err | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="
              Get-Content $_.FullName -ErrorAction SilentlyContinue | Select-Object -Last 200
            }
          } else {
            Write-Host "TurboQuant plugin build dir missing: $root"
          }

      - name: Verify pinned TurboQuant runtime
        shell: pwsh
        run: |
          $runtime = "build/windows/x64/runner/Release/erebrus_turboquant/llama-server.exe"
          $manifest = "build/windows/x64/runner/Release/erebrus_turboquant/erebrus-turboquant-runtime.json"
          if (!(Test-Path $runtime) -or !(Test-Path $manifest)) { exit 1 }
          $metadata = Get-Content $manifest | ConvertFrom-Json
          if ($metadata.revision -ne "c26cbdffcf6fc9b7430cd6b117757e9a3f70b7ea") { exit 1 }
          if ($metadata.source_archive_sha256 -ne "5a7221222d658ca93dbf62ba2ca0623712547e9640605c12ebdfa8963aeda239") { exit 1 }
          if ($metadata.accelerator -ne "CPU") { exit 1 }
          if ($metadata.key_cache -ne "q8_0" -or $metadata.value_cache -ne "turbo3") { exit 1 }
          # The archive checksum (enforced by CMake) and the manifest pin the source;
          # --version reports the enclosing repo's commit, so only check it runs.
          & $runtime --version 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "dist/erebrus-ai-windows-ci.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: dist/erebrus-ai-windows-ci.zip

  build-linux:
    name: Build Linux
    needs: verify
    # Pinned rather than ubuntu-latest: the bundle links against the build
    # host's glibc, so a newer image would stop it running on Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Plugin system libraries: libsecret (flutter_secure_storage),
      # GStreamer (audioplayers), ayatana-appindicator (tray_manager).
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev \
            libsecret-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: cp env.example .env
      - run: flutter pub get
      - run: scripts/ci-annotate.sh flutter build linux --release

      - name: Verify pinned TurboQuant runtime
        run: |
          runtime=build/linux/x64/release/bundle/lib/erebrus_turboquant/llama-server
          manifest=build/linux/x64/release/bundle/lib/erebrus_turboquant/erebrus-turboquant-runtime.json
          test -x "$runtime"
          grep -q '"revision": "c26cbdffcf6fc9b7430cd6b117757e9a3f70b7ea"' "$manifest"
          grep -q '"source_archive_sha256": "5a7221222d658ca93dbf62ba2ca0623712547e9640605c12ebdfa8963aeda239"' "$manifest"
          grep -q '"accelerator": "CPU"' "$manifest"
          grep -q '"key_cache": "q8_0"' "$manifest"
          grep -q '"value_cache": "turbo3"' "$manifest"
          # The archive checksum (enforced by CMake) and the manifest pin the source;
          # --version reports the enclosing repo's commit, so only check it runs.
          "$runtime" --version > /dev/null 2>&1

  build-android:
    name: Build Android APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: cp env.example .env
      - run: flutter pub get

      # sdkmanager is not on PATH on the hosted image (exit 127).
      - name: Install pinned Android NDK for TurboQuant candidate
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      - name: Cross-compile TurboQuant ARM64 CPU candidate
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          scripts/ci-annotate.sh tool/build_turboquant_android.sh \
            CPU \
            /tmp/erebrus-turboquant-android-source \
            /tmp/erebrus-turboquant-android-build

      # Debug-signed here: no release keys in CI. release.yml signs.
      - run: scripts/ci-annotate.sh flutter build apk --flavor playstore --release

      - name: Verify packaged Whisper ABIs
        run: |
          unzip -l build/app/outputs/flutter-apk/app-playstore-release.apk > apk-contents.txt
          grep -q 'lib/arm64-v8a/libwhisper.so' apk-contents.txt
          grep -q 'lib/armeabi-v7a/libwhisper.so' apk-contents.txt
          grep -q 'lib/x86_64/libwhisper.so' apk-contents.txt
          grep -q 'lib/arm64-v8a/liblib_llama_cpp_android.so' apk-contents.txt
          if grep -q 'liberebrus_turboquant_android' apk-contents.txt; then
            echo "Uncertified TurboQuant Android runtime must not ship" >&2
            exit 1
          fi

      - name: Upload Android TurboQuant build candidate
        uses: actions/upload-artifact@v4
        with:
          name: turboquant-android-arm64-cpu-candidate
          path: |
            /tmp/erebrus-turboquant-android-build/bin/llama-simple
            /tmp/erebrus-turboquant-android-build/bin/test-quantize-fns

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-playstore-release.apk
