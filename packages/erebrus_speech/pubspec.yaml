name: erebrus_speech
description: Native on-device SpeechAnalyzer bridge for Erebrus AI.
version: 0.0.1
homepage: https://erebrus.io
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ErebrusSpeechPlugin
      macos:
        pluginClass: ErebrusSpeechPlugin
